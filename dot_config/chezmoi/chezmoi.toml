# chezmoi client configuration.
#
# sourceDir is set by `chezmoi init` to ~/.local/share/chezmoi (a copy of
# this dotfiles repo). This file documents the intent and can be extended
# with template data or encryption settings in later epochs.
#
# Per-machine secret encryption (age/pgp) is deferred to a later epoch.

version = 2

[sourceDir]
  path = "~/.local/share/chezmoi"

[encryption]
  age = "recipient-age-placeholder"
  age-identity = "path/to/age-key.txt"
