name: E2E (mise + chezmoi migration)

on:
  push:
    branches: ['*']
  pull_request:
    branches: [main]

jobs:
  e2e:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        ubuntu-version: [26.04, 26.10]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker test image (cached layers)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: test/e2e/Dockerfile
          tags: dotfiles-e2e:${{ matrix.ubuntu-version }}
          build-args: |
            UBUNTU_VERSION=${{ matrix.ubuntu-version }}
          cache-from: type=gha,scope=dotfiles-e2e-${{ matrix.ubuntu-version }}
          cache-to: type=gha,mode=max,scope=dotfiles-e2e-${{ matrix.ubuntu-version }}
          load: true

      - name: Run E2E test
        run: |
          docker run --rm -v "$(pwd)/test/e2e/run-e2e.sh:/dotfiles/test/e2e/run-e2e.sh:ro" \
            dotfiles-e2e:${{ matrix.ubuntu-version }} bash /dotfiles/test/e2e/run-e2e.sh
