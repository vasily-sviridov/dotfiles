name: E2E (mise + chezmoi migration)

on:
  push:
    branches: ['*']
  pull_request:
    branches: [main]

jobs:
  e2e:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker test image (cached layers, load into local docker)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: test/e2e/Dockerfile
          tags: dotfiles-e2e
          load: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Run E2E test
        run: |
          docker run --rm -v "$(pwd)/test/e2e/run-e2e.sh:/dotfiles/test/e2e/run-e2e.sh:ro" \
            dotfiles-e2e bash /dotfiles/test/e2e/run-e2e.sh
