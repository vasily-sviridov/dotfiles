name: E2E (mise + chezmoi migration)

on:
  push:
    paths:
      - 'install'
      - 'dependencies/**'
      - '.mise.toml'
      - 'dot_config/chezmoi/**'
      - 'dot_*'
      - 'dot_shell/**'
      - 'dot_zshrc'
      - '.github/workflows/e2e.yml'
      - 'test/e2e/**'
  pull_request:
    paths:
      - 'install'
      - 'dependencies/**'
      - '.mise.toml'
      - 'dot_config/chezmoi/**'
      - 'dot_*'
      - 'dot_shell/**'
      - 'dot_zshrc'
      - '.github/workflows/e2e.yml'
      - 'test/e2e/**'

jobs:
  e2e:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build Docker test image
        run: |
          docker build -t dotfiles-e2e -f test/e2e/Dockerfile .

      - name: Run E2E test
        run: |
          docker run --rm -v "$(pwd)/test/e2e/run-e2e.sh:/dotfiles/test/e2e/run-e2e.sh:ro" \
            dotfiles-e2e bash /dotfiles/test/e2e/run-e2e.sh
