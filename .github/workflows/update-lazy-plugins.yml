name: Update lazy.nvim plugins

on:
  schedule:
    - cron: "0 2 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: rhysd/action-setup-vim@v1
        with:
          neovim: true
          version: nightly

      - name: Update plugins
        run: |
          export XDG_CONFIG_HOME="$PWD/.ci-config"
          export XDG_DATA_HOME="$PWD/.ci-data"
          mkdir -p "$XDG_CONFIG_HOME/nvim"

          cp -r nvim/* "$XDG_CONFIG_HOME/nvim/"

          nvim --headless \
            -u "$XDG_CONFIG_HOME/nvim/init.lua" \
            -c "lua require('lazy').sync({ wait = true })" \
            -c "qa!" 2>&1 | tee /tmp/lazy-update.log || true

          cat /tmp/lazy-update.log

          LOCKFILE="$XDG_CONFIG_HOME/nvim/lazy-lock.json"
          if [ ! -f "$LOCKFILE" ]; then
            LOCKFILE="$XDG_DATA_HOME/nvim/lazy/lazy-lock.json"
          fi

          if [ -f "$LOCKFILE" ]; then
            cp "$LOCKFILE" nvim/lazy-lock.json
          else
            echo "ERROR: lazy-lock.json not found"
            find "$XDG_CONFIG_HOME" "$XDG_DATA_HOME" -name "lazy-lock.json" 2>/dev/null
            exit 1
          fi

          rm -rf "$XDG_CONFIG_HOME" "$XDG_DATA_HOME"

          git diff --exit-code nvim/lazy-lock.json || echo "CHANGES=true" >> "$GITHUB_ENV"

      - name: Create Pull Request
        if: env.CHANGES == 'true'
        uses: peter-evans/create-pull-request@v8
        with:
          commit-message: "chore: update lazy.nvim plugins"
          title: "chore: update lazy.nvim plugins"
          body: "Automated plugin updates via lazy.nvim"
          branch: "update/lazy-plugins"
          delete-branch: true
          reviewers: "vasily-sviridov"
          labels: "dependencies"
